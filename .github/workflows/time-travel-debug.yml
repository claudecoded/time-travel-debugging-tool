name: Open-Source Time-Travel Debugger

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write

jobs:
  record-failures:
    name: Record Execution Trace via RR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment Dependencies
        run: |
          sudo apt-get update
          # Install rr debugger and development tools needed for capture
          sudo apt-get install -y rr gdb
          
          # CRITICAL FOR RR: GitHub Runners need permission to read performance counters
          sudo sysctl -w kernel.perf_event_paranoid=1

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Project Dependencies
        run: npm ci

      - name: Run Tests Under Time-Travel Recorder
        id: test-run
        # rr record logs the execution of the process tree natively
        run: rr record npm test
        continue-on-error: true

      - name: Pack Time-Travel Trace Log
        if: steps.test-run.outcome == 'failure'
        run: |
          echo "Test suite failed! Bundling the deterministic execution trace..."
          # Locates the latest rr recording directory and tars it
          LATEST_TRACE=\$(ls -td ~/.local/share/rr/* | head -n 1)
          tar -czf time-travel-trace.tar.gz -C \((dirname\)LATEST_TRACE) \((basename\)LATEST_TRACE)

      - name: Upload Time-Travel Artifact to GitHub
        if: steps.test-run.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: time-travel-debug-trace
          path: time-travel-trace.tar.gz
          retention-days: 5

      - name: Notify Developer on Pull Request
        if: steps.test-run.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = `### 🔍 Open-Source Time-Travel Debug Trace Generated!\n\n` +
              `A test failed during this CI execution. An execution snapshot has been recorded.\n\n` +
              `**How to debug this failure locally step-by-step:**\n` +
              `1. Download the \`time-travel-debug-trace\` zip file from the **Summary/Artifacts** tab of this workflow run.\n` +
              `2. Extract the file into your local Linux/WSL environment.\n` +
              `3. Make sure \`rr\` is installed (\`sudo apt install rr\`).\n` +
              `4. Run the reverse-debugger locally to walk backward in time:\n` +
              `   \`\`\`bash\n` +
              `   rr replay ./path_to_extracted_trace_folder\n` +
              `   \`\`\`\n` +
              `5. Use standard GDB commands like \`reverse-next\` (\`rn\`) or \`reverse-step\` (\`rs\`) to watch variables change in reverse!`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });

            core.setFailed("Execution failed. Time-travel diagnostics trace is available in the run artifacts.");
