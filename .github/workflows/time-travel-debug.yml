name: Time-Travel Debugger CI

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-record:
    name: Run and Record Tests with Time-Travel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Replay Chromium Browser
        run: npx replayio install

      - name: Execute Tests with Time-Travel Recording
        id: run-tests
        # We record the test run using replayio prefix to trap the execution state
        run: npx replayio record npm test
        continue-on-error: true

      - name: Upload Time-Travel Recording to Cloud
        if: steps.run-tests.outcome == 'failure'
        id: upload-recording
        env:
          REPLAY_API_KEY: \${{ secrets.REPLAY_API_KEY }}
        run: |
          echo "Test suite failed! Uploading recording to Replay DevTools cloud..."
          # Uploads recordings and filters the output to extract the view URL
          npx replayio upload --json > replay_metadata.json
          
          # Extracts the first recording URL from the generated JSON report
          RECORDING_URL=\$(node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('replay_metadata.json', 'utf8'));
            if(data.recordings && data.recordings.length > 0) {
              console.log('https://replay.io' + data.recordings[0].id);
            } else {
              console.log('NOT_FOUND');
            }
          ")
          echo "URL=\$RECORDING_URL" >> \$GITHUB_OUTPUT

      - name: Post Time-Travel Debug Link on Pull Request
        if: steps.run-tests.outcome == 'failure' && steps.upload-recording.outputs.URL != 'NOT_FOUND'
        uses: actions/github-script@v7
        with:
          script: |
            const recordingUrl = "\${{ steps.upload-recording.outputs.URL }}";
            
            const commentBody = `### 🚨 Test Suite Failed! Time-Travel Debugger Ready\n\n` +
              `A test failed during the CI run. Instead of downloading logs, you can replay the exact execution trace line-by-line in your browser:\n\n` +
              `👉 **[Click Here to Open Time-Travel Debugger]('\${recordingUrl}')**\n\n` +
              `*Inside the Replay UI, you can add retro-active console.logs, step backward through execution blocks, and inspect variable states at any millisecond.*`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });

            // Force CI failure so the PR stays blocked until fixed
            core.setFailed("Tests failed. Please use the time-travel link above to debug the issue.");
